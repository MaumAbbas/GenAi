[project]
name = "genal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
]

[project.scripts]
genal = "genal:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
